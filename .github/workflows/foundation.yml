name: Playable foundation
on:
  pull_request:
    paths-ignore: ["docs/**", "README.md", "CHANGELOG.md"]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vt_test
          POSTGRES_USER: vt_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vt_test -d vt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VT_DATABASE_URL: postgresql+psycopg://vt_test:ci-only-password@127.0.0.1:5432/vt_test
      VT_TEST_DATABASE_URL: postgresql+psycopg://vt_test:ci-only-password@127.0.0.1:5432/vt_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - name: Execute database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Test rules, APIs, concurrency and PostgreSQL persistence
        run: python -m pytest backend/tests -q
      - name: Validate generated content
        run: |
          python -m tools.build_catalog
          git diff --exit-code godot_project/data/catalog.json
      - name: Validate benchmark art budgets and editable sources
        run: python -m tools.check_art
      - name: Validate content branches, runtime bindings and asset status
        run: python -m tools.author_content check
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - name: Install pinned Godot editor
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and playable smoke check
        run: python -m tools.check_godot
      - name: Godot to API integration with two players
        run: python -m tools.check_online
      - name: Isolated authored example through Godot and API
        run: python -m tools.check_authoring

  android:
    needs: [backend, godot]
    env:
      VT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r backend/requirements.lock Pillow==11.3.0
      - name: Validate Android window readiness parser
        run: python -m unittest discover -s tools/tests
      - name: Install pinned Godot editor and export templates
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
      - name: Install Android export dependencies
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          python -c 'import os,subprocess; sdk=os.environ["ANDROID_HOME"]; subprocess.run([sdk+"/cmdline-tools/latest/bin/sdkmanager","--sdk_root="+sdk,"--licenses"],input="y\n"*100,text=True,check=True)'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg
      - name: Export and verify ARM64 and emulator APKs
        run: python -m tools.export_android --emulator
      - name: Render and draw-call gate
        run: xvfb-run -a python -m tools.check_render
      - name: Matching before and after benchmark routes
        run: xvfb-run -a python -m tools.record_benchmark
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android install, touch and resume check
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # ANGLE over SwiftShader supports the GLES3 shaders used by Godot.
          # The old swiftshader_indirect GLES translator failed uniform linking.
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: python -m tools.check_android
      - name: Retain installable ARM64 artifact and render evidence
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-tides-android-foundation
          retention-days: 90
          path: |
            builds/veilbound-tides-0.2.5-android.apk
            builds/veilbound-tides-0.2.5-android.apk.verification.txt
            builds/build-manifest.json
            builds/render-check/
      - name: Retain Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence
          retention-days: 90
          path: builds/android-check/
      - name: Retain render diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dawnreef-render-evidence
          retention-days: 90
          path: builds/render-check/
